<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Fluid — Dashboard un Izsoles</title>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e6e8e5;font-family:'Lexend',system-ui,sans-serif;color:#1d2329}a{color:#3f6e4a}a:hover{color:#2f5538}</style>
</helmet>
<section style="padding:56px 64px 80px;display:flex;flex-direction:column;gap:44px;width:max-content">
  <div style="display:flex;flex-direction:column;gap:6px;max-width:900px">
    <h1 style="margin:0;font-size:32px;font-weight:600;letter-spacing:-.02em">Fluid — Mans profils un Izsoles</h1>
    <p style="margin:0;font-size:16px;color:#5d6670;line-height:1.5">Visi ekrāni ir interaktīvi. Mobilajā: pavelc sludinājumu pa kreisi (Paslēpt / Dzēst), velc lotes paneli pa labi, lai aizvērtu, velc solīšanas paneli uz leju.</p>
  </div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
    <div style="display:flex;flex-direction:column;gap:24px">
      <h2 style="margin:0;font-size:24px;font-weight:600;letter-spacing:-.015em">{{ g.title }}</h2>
      <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;max-width:3100px">
        <sc-for list="{{ g.desk }}" as="d" hint-placeholder-count="3">
          <div id="{{ d.id }}" style="display:flex;flex-direction:column;gap:14px">
            <div style="display:flex;align-items:center;gap:10px"><span style="padding:3px 9px;border-radius:6px;background:#3b5166;color:#fff;font-size:13px;font-weight:600">{{ d.id }}</span><span style="font-size:16px;font-weight:500">{{ d.label }}</span></div>
            <iframe src="{{ d.src }}" title="{{ d.label }}" style="width:1440px;height:900px;border:0;border-radius:14px;box-shadow:0 20px 50px rgba(20,26,32,.15);background:#f5f6f4"></iframe>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap">
        <sc-for list="{{ g.phones }}" as="p" hint-placeholder-count="4">
          <div id="{{ p.id }}" style="display:flex;flex-direction:column;gap:14px">
            <div style="display:flex;align-items:center;gap:10px"><span style="padding:3px 9px;border-radius:6px;background:#3b5166;color:#fff;font-size:13px;font-weight:600">{{ p.id }}</span><span style="font-size:16px;font-weight:500">{{ p.label }}</span></div>
            <div style="width:410px;height:864px;padding:10px;box-sizing:border-box;border-radius:56px;background:#1d2329;box-shadow:0 30px 60px rgba(20,26,32,.22)">
              <iframe src="{{ p.src }}" title="{{ p.label }}" style="width:390px;height:844px;border:0;border-radius:46px;display:block;background:#f5f6f4"></iframe>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const D = 'Lauks24 Dashboard Fluid.dc.html?startTab=', I = 'Izsole Fluid.dc.html?';
    return { groups: [
      { title: 'Mans profils', desk: [['overview', 'Pārskats'], ['listings', 'Sludinājumi'], ['form', 'Jauns sludinājums']].map(([t, label], i) => ({ id: 'p' + (i + 1), label, src: D + t })),
        phones: [['overview', 'Pārskats'], ['listings', 'Sludinājumi'], ['form', 'Jauns sludinājums'], ['account', 'Konts']].map(([t, label], i) => ({ id: 'pm' + (i + 1), label, src: D + t })) },
      { title: 'Izsoles', desk: [['startView=home', 'Izsoļu saraksts'], ['startView=auction&registered=1', 'Izsole — lotes'], ['startView=auction&startLot=a1-4&registered=1', 'Lote']].map(([q, label], i) => ({ id: 'i' + (i + 1), label, src: I + q })),
        phones: [['startView=home', 'Izsoļu saraksts'], ['startView=auction&registered=1', 'Lotes'], ['startView=auction&startLot=a1-4&registered=1', 'Lote'], ['startView=my&registered=1', 'Manas izsoles']].map(([q, label], i) => ({ id: 'im' + (i + 1), label, src: I + q })) }
    ] };
  }
}
</script>
</body>
</html>
